<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Support Chat</title>
  <style>
    :root { color: #18222b; background: #eef2f0; font-family: Georgia, "Times New Roman", serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background-image: linear-gradient(90deg, rgba(27, 103, 91, .05) 1px, transparent 1px), linear-gradient(rgba(27, 103, 91, .05) 1px, transparent 1px); background-size: 24px 24px; }
    main { width: min(880px, calc(100% - 32px)); min-height: 100vh; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 30px 4px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 2px solid #1b675b; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .status { color: #276c49; font: 600 12px/1.2 Verdana, sans-serif; text-transform: uppercase; }
    #messages { padding: 24px 0; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
    .message { max-width: 82%; padding: 14px 16px; border: 1px solid #b7c5bd; border-radius: 6px; white-space: pre-wrap; font-size: 17px; line-height: 1.45; }
    .assistant { align-self: flex-start; background: #fffdf7; border-left: 4px solid #1b675b; }
    .user { align-self: flex-end; background: #dcece6; border-right: 4px solid #c55a31; }
    form { padding: 18px 0 30px; border-top: 1px solid #b7c5bd; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    input { min-width: 0; padding: 13px; border: 1px solid #6f8178; border-radius: 4px; font: 16px Georgia, serif; }
    button { padding: 0 18px; border: 0; border-radius: 4px; background: #1b675b; color: white; cursor: pointer; font: 600 14px Verdana, sans-serif; }
    button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 600px) { main { width: min(100% - 24px, 880px); } header { padding-top: 20px; } h1 { font-size: 23px; } .message { max-width: 92%; } form { grid-template-columns: 1fr; } button { min-height: 42px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Device Support Chat</h1><span class="status">MCP connected</span></header>
    <section id="messages" aria-live="polite">
      <div class="message assistant">Ask about device history, provisioning, or diagnostics.</div>
    </section>
    <form id="chat-form"><input id="message" placeholder="Ask about a device..." autocomplete="off" required><button id="send" type="submit">Send</button></form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    function addMessage(text, type) {
      const message = document.createElement('div');
      message.className = `message ${type}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      input.disabled = true;
      send.disabled = true;
      try {
        const reply = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
        const data = await reply.json();
        addMessage(reply.ok ? data.answer : `Error: ${data.detail || 'Unable to get an answer.'}`, 'assistant');
      } catch { addMessage('Error: Could not connect to the chat service.', 'assistant'); }
      input.disabled = false;
      send.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
